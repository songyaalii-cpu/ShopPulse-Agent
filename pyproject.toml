[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shoppulse-langgraph"
version = "0.1.0"
description = "ShopPulse - LangGraph e-commerce operations analytics data platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LangChain Core
    "langchain>=1.3.10",
    "langchain-core>=1.3.3",
    "langchain-anthropic>=1.4.6",
    "langchain-openai>=1.1.14",
    # LangGraph
    "langgraph>=0.2.0",
    # LangSmith
    "langsmith>=0.8.18",
    # RAG & Embeddings
    "langchain-huggingface>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=3.0.0",
    # Jupyter
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    # Utilities
    "python-dotenv>=1.2.2",
    "langgraph-cli[inmem]>=0.4.4",
    # Phase-one PostgreSQL data platform
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "sqlglot>=26,<30",
    # Phase-three production application
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "redis>=5.2,<7",
    "arq>=0.26,<1",
    "structlog>=24.4,<26",
    "httpx>=0.28,<1",
    # Evaluation
    "agentevals>=0.0.9",
    "openevals>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "pytest-asyncio>=0.25,<1",
    "fakeredis>=2.26,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["tools", "agents", "deployments", "evaluators", "shoppulse"]

[project.scripts]
shoppulse-wait-db = "shoppulse.cli.wait_for_db:main"
shoppulse-migrate-sqlite = "shoppulse.cli.migrate_sqlite:main"
shoppulse-generate = "shoppulse.cli.generate_data:main"
shoppulse-quality = "shoppulse.cli.data_quality:main"
shoppulse-analyze = "shoppulse.cli.analyze:main"
shoppulse-analytics-eval = "shoppulse.evals.analytics_eval:main"
shoppulse-api = "shoppulse.api.app:main"
shoppulse-worker = "shoppulse.worker.main:main"
shoppulse-eval = "shoppulse.evals.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a reachable disposable PostgreSQL database"]
